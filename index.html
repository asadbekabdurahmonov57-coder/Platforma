<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIV Qonunlari Platformasi</title>
    <style>
        /* NUSXALASHNI TAQIQLASH (CSS) */
        body {
            -webkit-user-select: none;  
            -moz-user-select: none;     
            -ms-user-select: none;      
            user-select: none;          
            background-color: #f0f4f8;
            color: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* Simdif uslubidagi katta header (Muqova) */
        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 5px solid #3b82f6;
        }

        /* IIV Logotipi uchun CSS uslubi */
        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: rgba(255, 255, 255, 0.1); 
            padding: 5px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Sarlavha atrofidagi YALTIROQ OVAL RAMKA */
        .oval-shining-container {
            display: inline-block;
            padding: 15px 40px;
            margin-bottom: 25px;
            border-radius: 50px; 
            border: 2px solid #f59e0b; 
            position: relative;
            background-color: rgba(15, 23, 42, 0.6); 
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4), inset 0 0 15px rgba(245, 158, 11, 0.4);
            animation: ovalPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes ovalPulse {
            0% {
                box-shadow: 0 0 10px rgba(245, 158, 11, 0.3), inset 0 0 10px rgba(245, 158, 11, 0.2);
                border-color: #d97706;
            }
            100% {
                box-shadow: 0 0 25px rgba(255, 215, 0, 0.9), inset 0 0 20px rgba(255, 215, 0, 0.6);
                border-color: #fff; 
            }
        }

        /* Oltin rangli yozuv */
        .shiny-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0;
            color: #f59e0b; 
            display: inline-block;
            background: linear-gradient(to right, #f59e0b 20%, #fff 50%, #f59e0b 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .hero-banner p {
            font-size: 16px;
            color: #93c5fd;
            margin-bottom: 25px;
        }

        /* Qidiruv paneli */
        .search-box {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid transparent;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #3b82f6;
        }

        /* Asosiy bloklar joylashuvu */
        .main-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .left-sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Modda qo'shish paneli */
        .upload-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid #10b981;
        }

        .upload-panel input, .upload-panel textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .upload-panel h2, .users-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #f8fafc;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #3b82f6;
            background-color: white;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: #059669;
        }

        /* Foydalanuvchilar ro'yxati paneli */
        .users-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid #3b82f6;
            display: none; 
        }

        /* Admin kirish tugmasi */
        .admin-login-btn {
            background: none;
            border: 1px dashed #cbd5e1;
            color: #64748b;
            padding: 10px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .admin-login-btn:hover {
            background-color: #f1f5f9;
            color: #1e3a8a;
        }

        .user-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            background-color: #e2e8f0;
            color: #1e3a8a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
        }

        .user-info .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }

        .user-info .user-role {
            font-size: 11px;
            color: #64748b;
        }

        /* O'ng tomon: Qonunlar bloki */
        .laws-list h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .modda-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border-left: 6px solid #1e3a8a;
            transition: 0.3s;
        }

        .modda-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .modda-number {
            font-size: 18px;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .modda-text {
            font-size: 15px;
            line-height: 1.7;
            color: #334155;
            white-space: pre-line;
        }

        .modda-footer {
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
            text-align: right;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="hero-banner">
        <div class="logo-container">
            <img src="logo.png" alt="IIV Logotipi">
        </div>
        
        <div class="oval-shining-container">
            <h1 class="shiny-title">ICHKI ISHLAR ORGANLARI TOʻGʻRISIDAGI QONUNI</h1>
        </div>
        
        <p>IIV tizimiga oid qonunlar, buyruqlar va moddalar toʻplami</p>
        
        <div class="search-box">
            <input type="text" id="searchBar" style="user-select: text;" placeholder="Modda raqami yoki kalit so'zni yozing..." oninput="searchModda()">
        </div>
    </div>

    <div class="main-container">
        
        <div class="left-sidebar">
            
            <div class="upload-panel">
                <h2>Yangi Modda Qoʻshish</h2>
                <form id="moddaForm" onsubmit="saveModda(event)">
                    <div class="form-group">
                        <label for="moddaTitle">Modda raqami / Nomi</label>
                        <input type="text" id="moddaTitle" placeholder="Masalan: 15-modda" required>
                    </div>
                    <div class="form-group">
                        <label for="moddaContent">Modda matni</label>
                        <textarea id="moddaContent" placeholder="Qonun matnini kiriting..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Bazaga saqlash</button>
                </form>
            </div>

            <button class="admin-login-btn" id="loginBtn" onclick="checkAdminPassword()">Foydalanuvchilar ro'yxati (Faqat Admin)</button>

            <div class="users-panel" id="adminUsersPanel">
                <h2>Roʻyxatdan oʻtganlar (<span id="userCount">0</span>)</h2>
                <ul class="user-list" id="usersContainer">
                    </ul>
            </div>

        </div>

        <div class="laws-list">
            <h2>Qonun hujjatlari matnlari</h2>
            <div id="moddaContainer">
                </div>
        </div>

    </div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 85 || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
        });

        function checkAdminPassword() {
            const password = prompt("Admin parolini kiriting:");
            if (password === "1234") {
                document.getElementById('adminUsersPanel').style.display = 'block';
                document.getElementById('loginBtn').style.display = 'none';
                alert("Xush kelibsiz Admin!");
            } else {
                alert("Xato parol!");
            }
        }

        const initialData = [
            {
                id: 1,
                title: "1-modda. Ushbu Qonunning maqsadi",
                text: "Ushbu Qonunning maqsadi ichki ishlar organlarining faoliyatini tartibga solishdan iborat.",
                date: "2026-05-19"
            }
        ];

        const initialUsers = [
            { id: 1, name: "Asadbek Anvarjonov", role: "Platforma Admini" },
            { id: 2, name: "Sardor Olimov", role: "Foydalanuvchi" },
            { id: 3, name: "Jasur Rahimov", role: "Foydalanuvchi" }
        ];

        let iivLaws = JSON.parse(localStorage.getItem('iiv_laws')) || initialData;
        let registeredUsers = JSON.parse(localStorage.getItem('registered_users')) || initialUsers;

        function renderLaws(data) {
            const container = document.getElementById('moddaContainer');
            container.innerHTML = '';
            if (data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b; padding: 20px;">Hech qanday ma\'lumot topilmadi.</p>';
                return;
            }
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'modda-card';
                card.innerHTML = `
                    <div class="modda-number">${item.title}</div>
                    <div class="modda-text">${item.text}</div>
                    <div class="modda-footer">Kiritilgan sana: ${item.date}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderUsers(users) {
            const container = document.getElementById('usersContainer');
            const countSpan = document.getElementById('userCount');
            container.innerHTML = '';
            countSpan.innerText = users.length;
            users.forEach(user => {
                const firstLetter = user.name.charAt(0).toUpperCase();
                const li = document.createElement('li');
                li.className = 'user-item';
                li.innerHTML = `
                    <div class="user-avatar">${firstLetter}</div>
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-role">${user.role}</div>
                    </div>
                `;
                container.appendChild(li);
            });
        }

        function saveModda(event) {
            event.preventDefault();
            const title = document.getElementById('moddaTitle').value;
            const text = document.getElementById('moddaContent').value;
            const today = new Date().toISOString().split('T')[0];

            const newModda = {
                id: Date.now(),
                title: title,
                text: text,
                date: today
            };

            iivLaws.unshift(newModda);
            localStorage.setItem('iiv_laws', JSON.stringify(iivLaws));
            renderLaws(iivLaws);
            document.getElementById('moddaForm').reset();
        }

        function searchModda() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const result = iivLaws.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.text.toLowerCase().includes(query)
            );
            renderLaws(result);
        }

        renderLaws(iivLaws);
        renderUsers(registeredUsers);
    </script>
</body>
</html>
