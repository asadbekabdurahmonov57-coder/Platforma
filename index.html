<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIV Qonunlari Platformasi</title>
    <style>
        /* NUSXALASHNI TAQIQLASH (CSS) */
        body {
            -webkit-user-select: none;  
            -moz-user-select: none;     
            -ms-user-select: none;      
            user-select: none;          
            background-color: #f0f4f8;
            color: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* Simdif uslubidagi katta header (Muqova) */
        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 5px solid #3b82f6;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: rgba(255, 255, 255, 0.1); 
            padding: 5px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            -webkit-touch-callout: none; 
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none; 
        }

        /* Sarlavha atrofidagi YALTIROQ OVAL RAMKA */
        .oval-shining-container {
            display: inline-block;
            padding: 15px 40px;
            margin-bottom: 25px;
            border-radius: 50px; 
            border: 2px solid #f59e0b; 
            position: relative;
            background-color: rgba(15, 23, 42, 0.6); 
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4), inset 0 0 15px rgba(245, 158, 11, 0.4);
            animation: ovalPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes ovalPulse {
            0% {
                box-shadow: 0 0 10px rgba(245, 158, 11, 0.3), inset 0 0 10px rgba(245, 158, 11, 0.2);
                border-color: #d97706;
            }
            100% {
                box-shadow: 0 0 25px rgba(255, 215, 0, 0.9), inset 0 0 20px rgba(255, 215, 0, 0.6);
                border-color: #fff; 
            }
        }

        /* Oltin rangli yozuv */
        .shiny-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0;
            color: #f59e0b; 
            display: inline-block;
            background: linear-gradient(to right, #f59e0b 20%, #fff 50%, #f59e0b 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .hero-banner p {
            font-size: 16px;
            color: #93c5fd;
            margin-bottom: 25px;
        }

        /* Qidiruv paneli */
        .search-box {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid transparent;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .search-box input:focus { border-color: #3b82f6; }

        /* Asosiy bloklar joylashuvu */
        .main-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: none; 
            grid-template-columns: 1fr 2fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .left-sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Bloklar paneli */
        .upload-panel, .register-panel, .users-panel, .admin-auth-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .upload-panel { border-top: 4px solid #10b981; }
        .register-panel { border-top: 4px solid #f59e0b; }
        .users-panel { border-top: 4px solid #3b82f6; }
        .admin-auth-panel { border-top: 4px solid #64748b; }

        .upload-panel input, .upload-panel textarea, .register-panel input, .admin-auth-panel input, .comment-input-box input {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #0f172a;
        }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #f8fafc;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #3b82f6;
            background-color: white;
        }

        .form-group textarea { height: 120px; resize: vertical; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-green { background-color: #10b981; }
        .btn-green:hover { background-color: #059669; }
        .btn-gold { background-color: #d97706; }
        .btn-gold:hover { background-color: #b45309; }
        .btn-navy { background-color: #1e3a8a; }
        .btn-navy:hover { background-color: #172554; }

        /* Maxsus ochiq registratsiya qutisi */
        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .status-msg {
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        .user-list { list-style: none; max-height: 250px; overflow-y: auto; }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .user-left { display: flex; align-items: center; }

        .user-avatar {
            width: 35px;
            height: 35px;
            background-color: #e2e8f0;
            color: #1e3a8a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
        }

        .user-info .user-name { font-size: 14px; font-weight: 600; color: #1e293b; }
        .user-info .user-status { font-size: 11px; color: #64748b; }
        .user-info .user-status.blocked { color: #ef4444; font-weight: bold; }

        /* Bloklash tugmasi */
        .btn-block {
            background-color: #f1f5f9;
            color: #ef4444;
            border: 1px solid #fee2e2;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-block.unblock { background-color: #dcfce7; color: #15803d; border-color: #bbf7d0; }

        /* Qonunlar ro'yxati */
        .laws-list { display: flex; flex-direction: column; }

        .modda-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border-left: 6px solid #1e3a8a;
        }

        .modda-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .modda-number { font-size: 18px; font-weight: 700; color: #1e3a8a; text-transform: uppercase; }

        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: none; 
        }

        .modda-text { font-size: 15px; line-height: 1.7; color: #334155; white-space: pre-line; }
        .modda-footer { margin-top: 15px; font-size: 12px; color: #94a3b8; text-align: right; border-bottom: 1px dashed #e2e8f0; padding-bottom: 10px; }

        /* KOMMENTARIYA TIZIMI */
        .comments-section { margin-top: 15px; background-color: #f8fafc; padding: 15px; border-radius: 8px; }
        .comments-title { font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        
        .comment-item { background: white; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
        .comment-meta { font-size: 11px; font-weight: bold; color: #1e3a8a; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .comment-meta span { color: #94a3b8; font-weight: normal; }
        .comment-body { font-size: 13px; color: #334155; -webkit-user-select: text; user-select: text; }

        .comment-input-box { display: flex; gap: 10px; margin-top: 12px; }
        .comment-input-box input { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
        .comment-input-box input:focus { border-color: #3b82f6; }
        .btn-reply { background-color: #3b82f6; color: white; border: none; padding: 8px 15px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-reply:hover { background-color: #2563eb; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="hero-banner">
        <div class="logo-container">
            <img src="logo.png" alt="IIV Logotipi" draggable="false">
        </div>
        
        <div class="oval-shining-container">
            <h1 class="shiny-title">ICHKI ISHLAR ORGANLARI TOʻGʻRISIDAGI QONUNI</h1>
        </div>
        
        <p>IIV tizimiga oid qonunlar, buyruqlar va moddalar toʻplami</p>
        
        <div class="search-box" id="searchBoxContainer" style="display: none;">
            <input type="text" id="searchBar" style="user-select: text;" placeholder="Modda raqami yoki kalit so'zni yozing..." oninput="searchModda()">
        </div>
    </div>

    <div class="auth-container" id="authScreen">
        <div class="register-panel">
            <h2>Platformadan foydalanish uchun roʻyxatdan oʻting</h2>
            <form id="registerForm" onsubmit="registerUser(event)">
                <div class="form-group">
                    <label for="regName">Ismingiz va Familiyangiz</label>
                    <input type="text" id="regName" placeholder="Masalan: Ali Valiyev" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Parol yarating</label>
                    <input type="password" id="regPassword" placeholder="Kamida 4 ta belgi" required>
                </div>
                <button type="submit" class="btn-submit btn-gold">Roʻyxatdan oʻtish va Kirish</button>
                <div id="authError" class="status-msg" style="color: #ef4444;"></div>
            </form>
        </div>
    </div>

    <div class="main-container" id="mainPlatform">
        
        <div class="left-sidebar">
            
            <div class="upload-panel">
                <h2>Yangi Modda Qoʻshish</h2>
                <form id="moddaForm" onsubmit="saveModda(event)">
                    <div class="form-group">
                        <label for="moddaTitle">Modda raqami / Nomi</label>
                        <input type="text" id="moddaTitle" placeholder="Masalan: 15-modda" required>
                    </div>
                    <div class="form-group">
                        <label for="moddaContent">Modda matni</label>
                        <textarea id="moddaContent" placeholder="Qonun matnini kiriting..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit btn-green">Bazaga saqlash</button>
                </form>
            </div>

            <div class="admin-auth-panel" id="adminAuthBlock">
                <h2>Admin Huquqlarini Tasdiqlash</h2>
                <div class="form-group">
                    <label for="adminPassInput">Maxfiy parol</label>
                    <input type="password" id="adminPassInput" placeholder="Admin parolini yozing...">
                </div>
                <button onclick="submitAdminLogin()" class="btn-submit btn-navy">Tizimni Tasdiqlash</button>
                <div id="adminStatusText" class="status-msg" style="color: #ef4444;"></div>
            </div>

            <div class="users-panel" id="adminUsersPanel">
                <h2>Roʻyxatdan oʻtgan fuqarolar (<span id="userCount">0</span>)</h2>
                <ul class="user-list" id="usersContainer">
                </ul>
            </div>

        </div>

        <div class="laws-list" id="moddaContainer">
        </div>

    </div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 85 || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        let isAdmin = false;
        let currentUserGlobal = null;

        const initialData = [
            {
                id: 1,
                title: "1-modda. Qonunning maqsadi",
                text: "Ushbu Qonunning maqsadi ichki ishlar organlarining faoliyatini tartibga solishdan iborat.",
                date: "2026-05-19",
                comments: [
                    { name: "Asadbek Anvarjonov", text: "Juda toʻgʻri shakllantirilgan modda.", date: "2026-05-19" }
                ]
            }
        ];

        let iivLaws = JSON.parse(localStorage.getItem('iiv_laws')) || initialData;
        let registeredUsers = JSON.parse(localStorage.getItem('registered_users')) || [];

        window.onload = function() {
            const savedUser = localStorage.getItem('current_logged_user');
            if (savedUser) {
                // Foydalanuvchi bloklanganligini tekshirish
                const userObj = registeredUsers.find(u => u.name === savedUser);
                if (userObj && userObj.isBlocked) {
                    localStorage.removeItem('current_logged_user');
                } else {
                    currentUserGlobal = savedUser;
                    showPlatform();
                }
            }
        }

        function showPlatform() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainPlatform').style.display = 'grid';
            document.getElementById('searchBoxContainer').style.display = 'block';
            renderLaws(iivLaws);
            renderUsers(registeredUsers);
        }

        // Fuqaro Registratsiyasi
        function registerUser(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorDiv = document.getElementById('authError');

            // Oldin bloklanganligini tekshirish
            const existingUser = registeredUsers.find(u => u.name.toLowerCase() === name.toLowerCase());
            if (existingUser && existingUser.isBlocked) {
                errorDiv.innerText = "Ushbu akkaunt admin tomonidan bloklangan!";
                errorDiv.style.display = 'block';
                return;
            }

            if(!existingUser) {
                const newUser = { id: Date.now(), name: name, isBlocked: false };
                registeredUsers.unshift(newUser);
                localStorage.setItem('registered_users', JSON.stringify(registeredUsers));
            }

            currentUserGlobal = name;
            localStorage.setItem('current_logged_user', name);
            errorDiv.style.display = 'none';
            showPlatform();
        }

        // JavaScript Prompt o'rniga oddiy panel orqali Admin kirishi
        function submitAdminLogin() {
            const pass = document.getElementById('adminPassInput').value;
            const statusText = document.getElementById('adminStatusText');

            if (pass === "1234") {
                isAdmin = true;
                statusText.innerText = "Admin huquqlari faollashdi!";
                statusText.style.color = "#10b981";
                statusText.style.display = "block";
                document.getElementById('adminUsersPanel').style.display = 'block';
                renderLaws(iivLaws);
                renderUsers(registeredUsers);
            } else {
                statusText.innerText = "Xato maxfiy parol!";
                statusText.style.color = "#ef4444";
                statusText.style.display = "block";
            }
        }

        // Moddalarni chizish va Kommentariyalar bloki
        function renderLaws(data) {
            const container = document.getElementById('moddaContainer');
            container.innerHTML = '';
            if (data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b; padding: 20px;">Hech qanday modda topilmadi.</p>';
                return;
            }
            data.forEach(item => {
                if(!item.comments) item.comments = [];
                
                const card = document.createElement('div');
                card.className = 'modda-card';
                const deleteBtnStyle = isAdmin ? 'display: block;' : 'display: none;';

                let commentsHTML = '';
                item.comments.forEach(com => {
                    commentsHTML += `
                        <div class="comment-item">
                            <div class="comment-meta">${com.name} <span>${com.date}</span></div>
                            <div class="comment-body">${com.text}</div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="modda-header">
                        <div class="modda-number">${item.title}</div>
                        <button class="btn-delete" style="${deleteBtnStyle}" onclick="deleteModda(${item.id})">Oʻchirish</button>
                    </div>
                    <div class="modda-text">${item.text}</div>
                    <div class="modda-footer">Kiritilgan sana: ${item.date}</div>
                    
                    <div class="comments-section">
                        <div class="comments-title">Muhokamalar (${item.comments.length})</div>
                        <div class="comments-list">${commentsHTML}</div>
                        <div class="comment-input-box">
                            <input type="text" id="input-com-${item.id}" placeholder="Fikringizni yozing (Reply)...">
                            <button class="btn-reply" onclick="addComment(${item.id})">Reply</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Kommentariya qo'shish (Reply)
        function addComment(moddaId) {
            const inputField = document.getElementById(`input-com-${moddaId}`);
            const commentText = inputField.value.trim();
            if(!commentText) return;

            const targetModda = iivLaws.find(item => item.id === moddaId);
            if(targetModda) {
                const today = new Date().toISOString().split('T')[0];
                targetModda.comments.push({
                    name: currentUserGlobal || "Fuqaro",
                    text: commentText,
                    date: today
                });
                localStorage.setItem('iiv_laws', JSON.stringify(iivLaws));
                renderLaws(iivLaws);
            }
            inputField.value = '';
        }

        function deleteModda(id) {
            iivLaws = iivLaws.filter(item => item.id !== id);
            localStorage.setItem('iiv_laws', JSON.stringify(iivLaws));
            renderLaws(iivLaws);
        }

        // Fuqarolarni ko'rsatish va BLOKLASH funksiyasi
        function renderUsers(users) {
            const container = document.getElementById('usersContainer');
            const countSpan = document.getElementById('userCount');
            container.innerHTML = '';
            countSpan.innerText = users.length;
            
            users.forEach(user => {
                const firstLetter = user.name.charAt(0).toUpperCase();
                const li = document.createElement('li');
                li.className = 'user-item';
                
                const statusLabel = user.isBlocked ? '<span class="user-status blocked">Bloklangan</span>' : '<span class="user-status">Faol</span>';
                const btnLabel = user.isBlocked ? 'Tiklash' : 'Bloklash';
                const btnClass = user.isBlocked ? 'btn-block unblock' : 'btn-block';

                li.innerHTML = `
                    <div class="user-left">
                        <div class="user-avatar">${firstLetter}</div>
                        <div class="user-info">
                            <div class="user-name">${user.name}</div>
                            ${statusLabel}
                        </div>
                    </div>
                    <button class="${btnClass}" onclick="toggleBlockUser(${user.id})">${btnLabel}</button>
                `;
                container.appendChild(li);
            });
        }

        // Akkauntni bloklash yoki blokdan chiqarish komandasi
        function toggleBlockUser(id) {
            const userObj = registeredUsers.find(u => u.id === id);
            if(userObj) {
                userObj.isBlocked = !userObj.isBlocked;
                localStorage.setItem('registered_users', JSON.stringify(registeredUsers));
                
                // Agar bloklangan odam hozir saytda o'tirgan bo'lsa uni haydash
                if(userObj.isBlocked && currentUserGlobal === userObj.name) {
                    localStorage.removeItem('current_logged_user');
                    location.reload();
                } else {
                    renderUsers(registeredUsers);
                }
            }
        }

        function saveModda(event) {
            event.preventDefault();
            const title = document.getElementById('moddaTitle').value;
            const text = document.getElementById('moddaContent').value;
            const today = new Date().toISOString().split('T')[0];

            const newModda = {
                id: Date.now(),
                title: title,
                text: text,
                date: today,
                comments: []
            };

            iivLaws.unshift(newModda);
            localStorage.setItem('iiv_laws', JSON.stringify(iivLaws));
            renderLaws(iivLaws);
            document.getElementById('moddaForm').reset();
        }

        function searchModda() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const result = iivLaws.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.text.toLowerCase().includes(query)
            );
            renderLaws(result);
        }
    </script>
</body>
</html>
